[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codewarden"
version = "0.1.0"
description = "AI-powered pull request review assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6.0"]

[project.optional-dependencies]
chroma = ["chromadb>=0.5"]
langchain = ["langchain-text-splitters>=0.3", "langchain-core>=0.3"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["codewarden[chroma,langchain,web]"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
codewarden = "codewarden.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codewarden = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
